[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "Local-first JARVIS agent for Windows using Ollama"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
desktop = ["PyQt6>=6.7"]
browser = ["playwright>=1.40,<2"]
full = ["PyQt6>=6.7","playwright>=1.40,<2","sounddevice>=0.4,<1","numpy>=1.24,<3","psutil>=5.9,<8","pillow>=10,<13","mss>=9,<11","pdfplumber>=0.11","python-docx>=1.1","fastapi>=0.110,<1","uvicorn[standard]>=0.27,<1"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
